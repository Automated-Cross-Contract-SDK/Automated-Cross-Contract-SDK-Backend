version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      stellar-sdk:
        patterns:
          - "@stellar/stellar-sdk"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
      build:
        patterns:
          - "tsup"
          - "tsx"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "size-limit"
          - "@size-limit/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
    commit-message:
      prefix: ci
