name: Feature request
description: Suggest a new capability or an API change
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: A sketch of how you would like to call it.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
