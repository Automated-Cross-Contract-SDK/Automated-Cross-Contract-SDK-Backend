name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The gitleaks GitHub Action needs a paid license for organization repos,
  # so run the free gitleaks CLI directly. Pinned version + checksum.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Run gitleaks (fails on findings)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only scan the commits this PR adds.
            log_opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            log_opts="${{ github.event.before }}..${{ github.sha }}"
            # First push of a branch has no "before" commit; scan everything.
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || log_opts="${{ github.sha }}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --log-opts="$log_opts" .
