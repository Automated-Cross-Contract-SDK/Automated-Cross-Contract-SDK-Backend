name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/sdk/src/**'
      - 'packages/sdk/scripts/**'
      - 'packages/footprint-parser-wasm/**'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to access base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fetch base branch for comparison
        run: |
          git fetch origin ${{ github.base.ref }}
          git checkout origin/${{ github.base.ref }}
          cd packages/sdk
          npx tsx scripts/benchmark.ts
          cp benchmark-results.json benchmark-results-base.json

      - name: Checkout PR branch
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        run: npm ci

      - run: npm run build

      - name: Run benchmarks & compare
        id: benchmarks
        working-directory: packages/sdk
        run: npx tsx scripts/benchmark.ts --compare

      # Comment benchmark results on the PR
      - name: Comment benchmark results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the benchmark comment from the output
            let commentBody = '## 🔬 Benchmark Results\n\n_Benchmarks completed. See CI logs for details._';

            // Try to read the results file for richer output
            try {
              const results = JSON.parse(fs.readFileSync('packages/sdk/benchmark-results.json', 'utf-8'));
              const comparisons = JSON.parse(fs.readFileSync('packages/sdk/benchmark-results-comparison.json', 'utf-8'));

              commentBody = '## 🔬 Benchmark Results\n\n';
              commentBody += `**Commit:** \`${results.commit}\` | **Branch:** \`${results.branch}\`\n\n`;

              // Build comparison table
              commentBody += '| Benchmark | Base (ms) | PR (ms) | Change | Threshold | Status |\n';
              commentBody += '|-----------|-----------|---------|--------|-----------|--------|\n';

              for (const c of comparisons) {
                const icon = c.regression ? '🔴' : '🟢';
                const sign = c.changePercent > 0 ? '+' : '';
                commentBody += `| ${c.name} | ${c.baseDurationMs.toFixed(2)} | ${c.prDurationMs.toFixed(2)} | ${sign}${c.changePercent}% | ${c.threshold}% | ${icon} ${c.regression ? 'FAIL' : 'PASS'} |\n`;
              }

              const regressions = comparisons.filter(c => c.regression);
              if (regressions.length > 0) {
                commentBody += '\n### ⚠️ Performance Regression Detected\n\n';
                for (const r of regressions) {
                  commentBody += `- **${r.name}**: +${r.changePercent}% slower (threshold: ${r.threshold}%)\n`;
                }
              } else {
                commentBody += '\n### ✅ All benchmarks within acceptable range\n';
              }
            } catch (e) {
              console.log('Could not read benchmark results:', e.message);
            }

            // Find existing benchmark comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const benchmarkComment = comments.find(c =>
              c.body.startsWith('## 🔬 Benchmark Results')
            );

            if (benchmarkComment) {
              await github.rest.issues.updateComment({
                comment_id: benchmarkComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }

      # Fail CI if performance regressions are detected
      - name: Check for regressions
        if: steps.benchmarks.outcome == 'failure'
        run: |
          echo "❌ Performance regression detected! See benchmark comment above."
          exit 1
