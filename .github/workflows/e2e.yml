name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The example app consumes the workspace packages, so build them first.
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/example

      # Playwright starts the Vite dev server itself (see playwright.config.ts).
      - name: Run e2e tests
        run: npm run test:e2e -w packages/example
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/example/playwright-report/
            packages/example/test-results/
          retention-days: 14
