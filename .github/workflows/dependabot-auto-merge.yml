name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Stellar SDK bumps can change Soroban RPC behavior that mocks do not catch.
      # They are never auto-merged; they wait for the integration suite (see
      # docs/upgrading-stellar-sdk.md).
      - name: Detect Stellar SDK bump
        id: route
        env:
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if echo "$DEP_NAMES" | grep -q '@stellar/stellar-sdk'; then
            echo "stellar=true" >> "$GITHUB_OUTPUT"
          else
            echo "stellar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label Stellar SDK PRs for integration review
        if: steps.route.outputs.stellar == 'true'
        run: |
          gh label create integration --color 0E8A16 --description "Requires testnet integration run" --force
          gh pr edit "$PR_URL" --add-label "dependencies,integration"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label auto-merge PRs
        if: steps.route.outputs.stellar == 'false'
        run: gh pr edit "$PR_URL" --add-label "dependencies,auto-merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Major bumps require manual review — do not auto-approve or auto-merge.
      # Stellar SDK bumps wait for the integration suite.
      - name: Approve and enable auto-merge (non-major, non-Stellar only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.route.outputs.stellar == 'false'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
