name: Bundle size

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check bundle size budgets
        uses: andresz1/size-limit-action@dd31dce7d85a7d0f0f0f0f0f0f0f0f0f0f0f0f0f # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: npm run size
          skip_step: install
