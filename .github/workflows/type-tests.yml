name: Type Tests

on:
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'packages/sdk/test-d/**'
  workflow_dispatch:

jobs:
  tsd:
    runs-on: ubuntu-latest
    name: Public API type tests (tsd)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:types -w packages/sdk
