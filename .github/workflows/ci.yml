name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - run: npx tsc --noEmit -p packages/sdk/tsconfig.json
      - run: npx tsc --noEmit -p packages/react/tsconfig.json

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fuzz XDR parsing (60s)
        working-directory: packages/sdk
        run: npm run test:fuzz

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Coverage (SDK)
        working-directory: packages/sdk
        run: npx vitest run --coverage

      - name: Coverage (React)
        working-directory: packages/react
        run: npx vitest run --coverage

  deploy-test-contracts:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    outputs:
      test-contract-id: ${{ steps.deploy.outputs.contract_id }}
      test-contract-hash: ${{ steps.deploy.outputs.contract_hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Stellar CLI
        run: |
          curl -sL https://soroban.stellar.org/cli | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Deploy test contract to testnet
        id: deploy
        run: |
          NETWORK=testnet
          WASM_PATH=packages/sdk/tests/fixtures/test_contract.wasm

          # If contract wasm doesn't exist, generate a minimal placeholder
          if [ ! -f "$WASM_PATH" ]; then
            echo "::warning::test_contract.wasm not found, skipping deploy"
            echo "contract_id=" >> $GITHUB_OUTPUT
            echo "contract_hash=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CONTRACT_ID=$(soroban contract deploy \
            --wasm "$WASM_PATH" \
            --source "${{ secrets.TEST_DEPLOYER_SECRET }}" \
            --network "$NETWORK" \
            --rpc-url https://soroban-testnet.stellar.org)

          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "contract_hash=$(sha256sum $WASM_PATH | cut -d' ' -f1)" >> $GITHUB_OUTPUT

          echo "Deployed contract: $CONTRACT_ID"
        env:
          TEST_DEPLOYER_SECRET: ${{ secrets.TEST_DEPLOYER_SECRET }}

      - name: Record deployed contract IDs
        run: |
          mkdir -p /tmp/test-contracts
          echo "{\"testnet\": {\"contract_id\": \"${{ steps.deploy.outputs.contract_id }}\", \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" > /tmp/test-contracts/deployed.json
        
      - name: Upload contract IDs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-contracts
          path: /tmp/test-contracts/deployed.json

  integration-tests:
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    needs: [deploy-test-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download deployed contract IDs
        uses: actions/download-artifact@v4
        with:
          name: test-contracts
          path: /tmp/test-contracts

      - run: npm ci

      - name: Run integration tests against testnet
        run: npm run test:integration -w packages/sdk
        env:
          RUN_INTEGRATION_TESTS: true
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          TEST_ACCOUNT_SECRET: ${{ secrets.TEST_ACCOUNT_SECRET }}
          DEPLOYED_CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}

      - name: Post failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Integration tests failed
              
              Integration tests against Soroban testnet have failed.
              
              [View workflow run](${runUrl})
              
              Please check the logs for details on the failure.`
            })

  cleanup-test-contracts:
    if: |
      always() &&
      needs.deploy-test-contracts.result == 'success' &&
      needs.deploy-test-contracts.outputs.test-contract-id != ''
    needs: [deploy-test-contracts, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -sL https://soroban.stellar.org/cli | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cleanup test contract (optional best-effort)
        continue-on-error: true
        run: |
          echo "Cleanup phase — test contracts are ephemeral on testnet and expire automatically."
          echo "Contract ID: ${{ needs.deploy-test-contracts.outputs.test-contract-id }}"

  # npm publishing and GitHub releases are handled by semantic-release —
  # see .github/workflows/release.yml and .releaserc.json.
