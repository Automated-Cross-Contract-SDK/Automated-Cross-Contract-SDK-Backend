name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - run: npx tsc --noEmit -p packages/sdk/tsconfig.json
      - run: npx tsc --noEmit -p packages/react/tsconfig.json

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/example

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: packages/example
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/example/playwright-report/
          retention-days: 30

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Coverage (SDK)
        working-directory: packages/sdk
        run: npx vitest run --coverage

      - name: Coverage (React)
        working-directory: packages/react
        run: npx vitest run --coverage

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Stryker mutation testing
        working-directory: packages/sdk
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: packages/sdk/reports/mutation/
          retention-days: 30

  version-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      matrix:
        rpc:
          - url: https://soroban-testnet.stellar.org
            passphrase: 'Test SDF Network ; September 2015'
          - url: https://rpc-futurenet.stellar.org
            passphrase: 'Test SDF Future Network ; October 2022'
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run version-matrix tests
        working-directory: packages/sdk
        run: npm run test:version-matrix
        env:
          SOROBAN_RPC_URL: ${{ matrix.rpc.url }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ matrix.rpc.passphrase }}
          RUN_VERSION_MATRIX: 'true'

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish SDK
        working-directory: packages/sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish React
        working-directory: packages/react
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
