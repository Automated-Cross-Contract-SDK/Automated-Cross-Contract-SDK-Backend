name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - run: npm run lint
      - run: npx tsc --noEmit -p packages/sdk/tsconfig.json
      - run: npx tsc --noEmit -p packages/react/tsconfig.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck every workspace package
        run: |
          # Packages listed in the known-failures file are reported as warnings so the
          # job stays green while they are fixed. Any other failing package fails the job.
          known=$(grep -v '^#' .github/typecheck-known-failures.txt | sed '/^$/d')
          failed=0
          for pkg in $(node -p "require('./package.json').workspaces.join(' ')"); do
            out=$(mktemp)
            if npm run typecheck -w "$pkg" --if-present >"$out" 2>&1; then
              status=0
            else
              status=$?
            fi
            echo "::group::typecheck $pkg (exit $status)"
            cat "$out"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              if echo "$known" | grep -qx "$pkg"; then
                echo "::warning file=$pkg/tsconfig.json::$pkg typecheck fails (listed in .github/typecheck-known-failures.txt)"
              else
                echo "::error file=$pkg/tsconfig.json::$pkg typecheck failed"
                failed=1
              fi
            fi
          done
          exit $failed

  nextjs-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Validate separate Next.js client and server entry points
        run: |
          # Consumer builds import the React package from both a client component
          # ("use client") and a server component / route handler. Each entry point
          # must resolve independently and must not leak the other environment's
          # globals. This guards against regressions where a single entry point is
          # assumed to work in both environments.
          node - <<'NODE'
          const assert = require('node:assert');
          const path = require('node:path');

          const pkgDir = path.resolve('packages/react');
          const pkg = require(path.join(pkgDir, 'package.json'));

          // The package must expose distinct client and server entry points.
          const exportsField = pkg.exports || {};
          const hasClient = Boolean(exportsField['./client'] || exportsField['.']);
          const hasServer = Boolean(exportsField['./server'] || exportsField['.']);
          assert.ok(hasClient, 'React package must expose a client entry point');
          assert.ok(hasServer, 'React package must expose a server entry point');

          // Both entry points must be importable without throwing.
          const clientEntry = require.resolve(path.join(pkgDir, 'dist/client.js'));
          const serverEntry = require.resolve(path.join(pkgDir, 'dist/server.js'));
          assert.ok(clientEntry, 'client entry point must resolve');
          assert.ok(serverEntry, 'server entry point must resolve');

          // The client entry must be marked as a client module so Next.js can
          // treat it as a client boundary; the server entry must not.
          const fs = require('node:fs');
          const clientSource = fs.readFileSync(clientEntry, 'utf8');
          const serverSource = fs.readFileSync(serverEntry, 'utf8');
          assert.ok(
            /^['"]use client['"]/.test(clientSource.trim()),
            'client entry point must start with a "use client" directive'
          );
          assert.ok(
            !/^['"]use client['"]/.test(serverSource.trim()),
            'server entry point must not declare a "use client" directive'
          );

          console.log('Next.js client and server entry points validated');
          NODE

  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fuzz XDR parsing (60s)
        working-directory: packages/sdk
        run: npm run test:fuzz

  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Coverage (SDK)
        working-directory: packages/sdk
        run: npx vitest run --coverage

      - name: Coverage (React)
        working-directory: packages/react
        run: npx vitest run --coverage

  deploy-test-contracts:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    outputs:
      test-contract-id: ${{ steps.deploy.outputs.contract_id }}
      test-contract-hash: ${{ steps.deploy.outputs.contract_hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Stellar CLI
        # Pinned crates.io release (checksum-verified by cargo via --locked); no piped installer.
        run: cargo install --locked stellar-cli --version 22.8.2

      - name: Deploy test contract to testnet
        id: deploy
        run: |
          NETWORK=testnet
          WASM_PATH=packages/sdk/tests/fixtures/test_contract.wasm

          # If contract wasm doesn't exist, generate a minimal placeholder
          if [ ! -f "$WASM_PATH" ]; then
            echo "::warning::test_contract.wasm not found, skipping deploy"
            echo "contract_id=" >> $GITHUB_OUTPUT
            echo "contract_hash=" >> $GITHUB_OUTPUT
            exit 0
          fi

          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_PATH" \
            --source "$TEST_DEPLOYER_SECRET" \
            --network "$NETWORK" \
            --rpc-url https://soroban-testnet.stellar.org)

          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "contract_hash=$(sha256sum $WASM_PATH | cut -d' ' -f1)" >> $GITHUB_OUTPUT

          echo "Deployed contract: $CONTRACT_ID"
        env:
          TEST_DEPLOYER_SECRET: ${{ secrets.TEST_DEPLOYER_SECRET }}

      - name: Record deployed contract IDs
        run: |
          mkdir -p /tmp/test-contracts
          echo "{\"testnet\": {\"contract_id\": \"${{ steps.deploy.outputs.contract_id }}\", \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" > /tmp/test-contracts/deployed.json

      - name: Upload contract IDs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-contracts
          path: /tmp/test-contracts/deployed.json

  integration-tests:
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    needs: [deploy-test-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download deployed contract IDs
        uses: actions/download-artifact@v4
        with:
          name: test-contracts
          path: /tmp/test-contracts

      - run: npm ci

      - name: Run integration tests against testnet
        run: npm run test:integration -w packages/sdk
        env:
          RUN_INTEGRATION_TESTS: true
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          TEST_ACCOUNT_SECRET: ${{ secrets.TEST_ACCOUNT_SECRET }}
          DEPLOYED_CONTRACT_ID: ${{ needs.deploy-test-contracts.outputs.test-contract-id }}

      - name: Post failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Integration tests failed
              
              Integration tests against Soroban testnet have failed.
              
              [View workflow run](${runUrl})
              
              Please check the logs for details on the failure.`
            })

  cleanup-test-contracts:
    if: |
      always() &&
      needs.deploy-test-contracts.result == 'success' &&
      needs.deploy-test-contracts.outputs.test-contract-id != ''
    needs: [deploy-test-contracts, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        # Pinned crates.io release (checksum-verified by cargo via --locked); no piped installer.
        run: cargo install --locked stellar-cli --version 22.8.2

      - name: Cleanup test contract (optional best-effort)
        continue-on-error: true
        run: |
          echo "Cleanup phase — test contracts are ephemeral on testnet and expire automatically."
          echo "Contract ID: ${{ needs.deploy-test-contracts.outputs.test-contract-id }}"

  # npm publishing and GitHub releases are handled by semantic-release —
  # see .github/workflows/release.yml and .releaserc.json.
