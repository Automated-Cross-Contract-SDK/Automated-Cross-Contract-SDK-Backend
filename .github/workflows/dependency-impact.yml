name: Dependency Impact Report

# Posts a detailed dependency impact report as a comment on dependency-update PRs
# (any PR labelled `dependencies`, which Dependabot applies automatically).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-report:
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependency trees
        run: |
          # Lifecycle scripts are skipped for safety on untrusted PR contents.
          for dir in base head; do
            ( cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund ) || true
            ( cd "$dir" && npm ls --all --json > "../$dir-tree.json" 2>/dev/null ) || echo '{}' > "$dir-tree.json"
            du -sh "$dir/node_modules" 2>/dev/null | cut -f1 > "$dir-size.txt" || echo 'n/a' > "$dir-size.txt"
          done

      - name: Build report
        # Runs the analysis script from the base ref (trusted), not the PR head.
        run: node base/.github/scripts/dependency-impact.mjs > report.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '## 📦 Dependency Impact Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number });
            }
