name: SBOM and attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file sbom.cdx.json

      - name: Pack workspace tarballs
        run: |
          mkdir -p artifacts
          npm pack --workspaces --pack-destination artifacts --ignore-scripts
          cp sbom.cdx.json artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/*

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: artifacts/*.tgz
          sbom-path: sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-tarballs
          path: artifacts/

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber
