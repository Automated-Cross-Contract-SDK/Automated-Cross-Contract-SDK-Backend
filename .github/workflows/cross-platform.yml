name: Cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Package build (also exercises ESM module resolution + path handling)
      - run: npm run build

      # Unit tests
      - run: npm run test

      # TypeScript compilation
      - run: npm run typecheck -w packages/sdk
      - run: npm run typecheck -w packages/react
