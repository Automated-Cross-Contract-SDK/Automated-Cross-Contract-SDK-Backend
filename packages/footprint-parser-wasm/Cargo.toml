[package]
name = "footprint-parser-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly-accelerated Soroban XDR footprint parser — 10-50x faster than TypeScript"
license = "MIT"
repository = "https://github.com/Automated-Cross-Contract-SDK/Automated-Cross-Contract-SDK-Backend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
stellar-xdr = { version = "22.0.0", features = ["next"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
